<title>成功大隊勤務看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">

<style>
:root{
  --ground:#0B1015;
  --surface:#141C24;
  --surface-2:#1B2530;
  --surface-3:#212D3A;
  --line:#263341;
  --line-soft:#1D2833;
  --ink:#EAF0F5;
  --ink-2:#93A6B6;
  --ink-3:#5E7183;
  --red:#E4392B;
  --red-dim:#7E2019;
  --green:#3DBE6B;
  --amber:#F2A93B;
  --blue:#4A9FD8;
  --violet:#9B8CD8;
  --topbar-1:#131C25;
  --topbar-2:#0E151C;
  --red-bright:#FF8478;
  --amber-bright:#FFD08A;
  --green-tint:rgba(61,190,107,.09);
  --green-tint-border:rgba(61,190,107,.28);

  --f-cond:"Barlow Condensed","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;

  --pad:clamp(12px,1.3vw,22px);
}

/* 日間模式：預設是深色（電視牆用），這裡是切換鈕開啟後的覆寫版本。
   語意色（紅/綠/琥珀/藍/紫）維持同一組色相，只是調深飽和度以維持
   在白底上的可讀對比，不是單純反白。 */
:root[data-theme="light"]{
  --ground:#EEF1F4;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --surface-3:#E9EDF1;
  --line:#D5DBE1;
  --line-soft:#E3E7EC;
  --ink:#1B242C;
  --ink-2:#55636F;
  --ink-3:#8894A0;
  --red:#C62B1E;
  --red-dim:#F0B8B0;
  --green:#1E8E52;
  --amber:#B36B00;
  --blue:#1B6FA8;
  --violet:#6A55B8;
  --topbar-1:#FFFFFF;
  --topbar-2:#F2F4F6;
  --red-bright:#A61D12;
  --amber-bright:#7A4A00;
  --green-tint:rgba(30,142,82,.09);
  --green-tint-border:rgba(30,142,82,.28);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:clamp(13px,.95vw,16px);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  transition:background .2s ease,color .2s ease;
}

/* ================= 頂部 ================= */
.topbar{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:var(--pad);
  padding:calc(var(--pad)*.8) var(--pad);
  background:linear-gradient(180deg,var(--topbar-1),var(--topbar-2));
  border-bottom:2px solid var(--red);
}
.unit{display:flex;flex-direction:column;gap:2px;min-width:0}
.unit-name{
  font-weight:900;
  font-size:clamp(16px,1.4vw,23px);
  letter-spacing:.04em;
}
.unit-sub{
  font-size:clamp(11px,.82vw,13.5px);
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.clockwrap{text-align:center;line-height:1}
.clock{
  font-family:var(--f-cond);
  font-weight:600;
  font-size:clamp(40px,5.4vw,92px);
  font-variant-numeric:tabular-nums;
  display:block;
}
.clock .sec{color:var(--ink-3);font-size:.5em;margin-left:.08em}
.clock-sub{
  font-size:clamp(10px,.8vw,13px);
  color:var(--ink-2);
  letter-spacing:.16em;
  margin-top:5px;
}
.slotwrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.slot-label{font-size:clamp(9.5px,.7vw,11.5px);color:var(--ink-3);letter-spacing:.2em}
.slot{
  font-family:var(--f-cond);
  font-weight:700;
  font-size:clamp(26px,3vw,52px);
  line-height:1;
  color:var(--red);
  font-variant-numeric:tabular-nums;
}
.slot-next{font-size:clamp(10px,.76vw,12.5px);color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ================= 告示 ================= */
.notice{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px var(--pad);
  background:rgba(242,169,59,.09);
  border-bottom:1px solid rgba(242,169,59,.26);
  font-size:clamp(10.5px,.8vw,13px);
  color:var(--amber);
}
.notice span:last-child{flex:1;min-width:0}
.notice b{color:var(--amber-bright);font-weight:700}
.notice-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--amber);flex:none;margin-top:.45em;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ================= 大隊總覽帶 ================= */
.strip{
  display:flex;align-items:stretch;gap:1px;
  background:var(--line-soft);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.strip-total{
  display:flex;align-items:center;gap:14px;
  padding:10px var(--pad);
  background:var(--surface-2);
  flex:none;
}
.strip-total .big{
  font-family:var(--f-cond);
  font-weight:700;
  font-size:clamp(30px,3vw,48px);
  line-height:1;
  font-variant-numeric:tabular-nums;
  color:var(--green);
}
.strip-total .lbl{font-size:clamp(10px,.78vw,12.5px);color:var(--ink-2);letter-spacing:.1em}
.strip-cell{
  flex:1 1 0;min-width:118px;
  background:var(--surface);
  padding:9px 12px;
}
.strip-cell .u{font-weight:700;font-size:clamp(12px,.92vw,15px)}
.strip-cell .c{font-size:clamp(10px,.75vw,12px);color:var(--ink-3);margin-top:1px}
.strip-cell .n{
  font-family:var(--f-mono);
  font-size:clamp(11px,.82vw,13.5px);
  color:var(--ink-2);
  margin-top:4px;
  font-variant-numeric:tabular-nums;
}
.strip-cell .n b{color:var(--ink);font-weight:600}

/* ================= 主版面 ================= */
.board{
  display:grid;
  grid-template-columns:2.05fr 1fr;
  gap:var(--pad);
  padding:var(--pad);
  align-items:start;
}
.col{display:flex;flex-direction:column;gap:var(--pad);min-width:0}

.panel{
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}
.panel-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:10px 13px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
}
.panel-title{font-weight:700;font-size:clamp(13px,1.05vw,17px);letter-spacing:.07em}
.panel-meta{
  font-family:var(--f-mono);
  font-size:clamp(10px,.78vw,12.5px);
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.panel-body{padding:13px}

/* ---- 分隊編組卡 ---- */
.squads{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--pad);
}
.sq{
  min-width:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
}
.sq-head{
  display:flex;align-items:center;gap:9px;
  padding:9px 12px;
  background:var(--surface-2);
  border-bottom:1px solid var(--line);
  border-left:3px solid var(--red);
}
.sq-name{font-weight:700;font-size:clamp(14px,1.1vw,18px)}
.sq-chief{font-size:clamp(10px,.76vw,12.5px);color:var(--ink-3)}
.sq-count{
  margin-left:auto;
  font-family:var(--f-mono);
  font-size:clamp(10.5px,.8vw,13px);
  color:var(--ink-2);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.sq-count b{color:var(--green);font-weight:600}
.sq-body{padding:11px 12px}

.row{
  display:grid;
  grid-template-columns:76px 1fr;
  gap:9px;
  padding:5px 0;
  border-bottom:1px solid rgba(38,51,65,.45);
  align-items:baseline;
}
.row:last-child{border-bottom:none}
.row-k{
  font-size:clamp(10.5px,.8vw,13px);
  color:var(--ink-3);
  letter-spacing:.05em;
  display:flex;align-items:center;gap:6px;
}
.row-k .dot{width:3px;height:12px;border-radius:1px;flex:none;background:var(--ink-3)}
.row.duty .row-k .dot{background:var(--red)}
.row.car .row-k .dot{background:var(--blue)}
.row.standby .row-k .dot{background:var(--green)}
.row.rest .row-k .dot{background:var(--ink-3)}
.row-v{
  font-size:clamp(12px,.95vw,15.5px);
  font-weight:500;
  min-width:0;
  overflow-wrap:anywhere;
}
.row.rest .row-v{color:var(--ink-3);font-weight:400}
.row-v.none{color:var(--ink-3);font-weight:400}
.row.car .row-k{color:var(--blue)}
.by-id .row-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.sq-note{
  margin-top:9px;padding-top:8px;
  border-top:1px solid var(--line-soft);
  font-size:clamp(10px,.76vw,12.5px);
  color:var(--ink-3);
  line-height:1.5;
}
.sq-thin{
  padding:16px 12px;
  color:var(--ink-3);
  font-size:clamp(11px,.85vw,13.5px);
  line-height:1.6;
}
.sq-thin .ids{
  font-family:var(--f-mono);
  color:var(--ink-2);
  font-size:1.05em;
}

/* ---- 當日勤務 ---- */
.task{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid rgba(38,51,65,.45);
}
.task:last-child{border-bottom:none}
.task-time{
  font-family:var(--f-mono);
  font-size:clamp(10.5px,.82vw,13px);
  color:var(--ink-2);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  padding-top:1px;
}
.task-main{min-width:0}
.task-name{font-size:clamp(12px,.95vw,15px);overflow-wrap:anywhere}
.task-sub{
  font-size:clamp(10px,.76vw,12.5px);
  color:var(--ink-3);
  margin-top:2px;
}
.task-sub .who{color:var(--ink-2);font-family:var(--f-mono)}
.task-unit{
  display:inline-block;
  font-size:clamp(9.5px,.7vw,11.5px);
  padding:1px 6px;border-radius:2px;
  margin-right:6px;
}
.task.live{
  background:rgba(228,57,43,.07);
  margin-inline:-7px;padding-inline:7px;
  border-left:2px solid var(--red);
}
.task.live .task-time{color:var(--red-bright)}
.task.past{opacity:.5}
.task.past:hover{opacity:.85}
.task-toggle{
  display:flex;align-items:center;gap:6px;
  padding:9px 0 3px;
  font-size:clamp(10.5px,.8vw,13px);
  color:var(--ink-2);
  cursor:pointer;user-select:none;
}
.task-toggle:hover{color:var(--ink)}
.task-toggle .arrow{font-size:.8em;color:var(--ink-3)}
.live-tag{
  font-size:clamp(9px,.68vw,11px);
  font-weight:700;letter-spacing:.14em;
  color:var(--red);margin-left:7px;
}

/* ---- 行事曆 ---- */
.cal-filter{
  display:flex;flex-wrap:wrap;gap:6px;
  padding:10px 13px 0;
}
.cal-chip{
  font-family:inherit;
  font-size:clamp(10.5px,.8vw,13px);
  padding:4px 10px;
  border-radius:20px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-3);
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease;
}
.cal-chip:hover{border-color:var(--ink-3)}
.cal-chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cal-chip.t1.on{background:rgba(74,159,216,.13);border-color:var(--blue);color:var(--blue)}
.cal-chip.t2.on{background:rgba(155,140,216,.13);border-color:var(--violet);color:var(--violet)}
.cal-chip.t3.on{background:rgba(61,190,107,.13);border-color:var(--green);color:var(--green)}
.cal-day{margin-bottom:13px}
.cal-day:last-child{margin-bottom:0}
.cal-daylabel{
  display:flex;align-items:baseline;gap:8px;
  padding-bottom:5px;
  border-bottom:1px solid var(--line-soft);
  margin-bottom:7px;
}
.cal-date{
  font-family:var(--f-cond);font-weight:700;
  font-size:clamp(16px,1.35vw,23px);line-height:1;
  font-variant-numeric:tabular-nums;
}
.cal-dow{font-size:clamp(10px,.8vw,12.5px);color:var(--ink-2);letter-spacing:.1em}
.cal-today{
  margin-left:auto;
  font-size:clamp(9px,.68vw,11px);font-weight:700;letter-spacing:.14em;
  color:var(--red);border:1px solid var(--red-dim);
  padding:1px 6px;border-radius:2px;
}
.ev{
  display:grid;grid-template-columns:auto 1fr;gap:9px;
  padding:6px 0;
  border-bottom:1px solid rgba(38,51,65,.4);
}
.ev:last-child{border-bottom:none}
.ev-time{
  font-family:var(--f-mono);
  font-size:clamp(10px,.78vw,12.5px);
  color:var(--ink-2);white-space:nowrap;
  font-variant-numeric:tabular-nums;padding-top:2px;
}
.ev-time.allday{color:var(--ink-3)}
.ev-main{min-width:0}
.ev-title{font-size:clamp(11.5px,.9vw,14px);line-height:1.4;overflow-wrap:anywhere}
.ev-tag{
  display:inline-block;
  font-size:clamp(9px,.68vw,11px);
  padding:1px 5px;border-radius:2px;margin-top:3px;
}
.ev-tag.t1{background:rgba(74,159,216,.13);color:var(--blue)}
.ev-tag.t2{background:rgba(155,140,216,.13);color:var(--violet)}
.ev-tag.t3{background:rgba(61,190,107,.13);color:var(--green)}
.ev-loc{font-size:clamp(9.5px,.72vw,11.5px);color:var(--ink-3);margin-top:2px}
.ev.now{
  background:rgba(228,57,43,.07);
  margin-inline:-6px;padding-inline:6px;
  border-left:2px solid var(--red);
}
.cal-empty{color:var(--ink-3);font-size:clamp(11px,.85vw,13px);padding:5px 0}

/* ---- 假別 ---- */
.leave-unit{margin-bottom:13px}
.leave-unit:last-child{margin-bottom:0}
.leave-title{
  font-weight:700;
  font-size:clamp(12px,.92vw,15px);
  padding-bottom:5px;margin-bottom:6px;
  border-bottom:1px solid var(--line-soft);
}
.leave{display:flex;flex-direction:column;gap:7px}
.leave-row{
  display:grid;grid-template-columns:64px 1fr;gap:9px;
  font-size:clamp(11px,.85vw,13.5px);
  padding:5px 0;
  border-bottom:1px solid rgba(38,51,65,.4);
}
.leave-row:last-child{border-bottom:none}
.leave-k{color:var(--ink-3);font-size:clamp(10px,.78vw,12.5px)}
.leave-v{min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}

/* ---- 頁尾 ---- */
.foot{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px 18px;
  padding:10px var(--pad) calc(var(--pad)*1.2);
  color:var(--ink-3);
  font-size:clamp(10px,.76vw,12.5px);
  border-top:1px solid var(--line-soft);
}
.foot .live{display:flex;align-items:center;gap:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 窄螢幕覆寫：務必放在樣式表最後，否則被上面的桌機規則蓋掉 ===== */
@media (max-width:1240px){
  .board{grid-template-columns:1fr}
}
@media (max-width:820px){
  .squads{grid-template-columns:1fr}
  .topbar{grid-template-columns:1fr;justify-items:center;text-align:center;gap:9px}
  .unit,.slotwrap{align-items:center}
  .strip{flex-wrap:wrap}
  .strip-total{width:100%;justify-content:center}
  .strip-cell{min-width:calc(50% - 1px)}
  .row{grid-template-columns:66px 1fr}
}
.controls{
  position:fixed;top:10px;right:10px;z-index:50;
  display:flex;gap:6px;
}
.ctrl-btn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink-2);
  font-size:17px;
  cursor:pointer;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.ctrl-btn:hover{background:var(--surface-3);color:var(--ink)}
.ctrl-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ctrl-btn.on{color:var(--green);border-color:var(--green)}
</style>

<script>
/* 越早套用主題越好，避免頁面先閃一下深色才切成淺色 */
try{
  if(localStorage.getItem("board-theme")==="light"){
    document.documentElement.setAttribute("data-theme","light");
  }
}catch(e){}
</script>

<div class="controls">
  <button class="ctrl-btn" id="themeToggle" type="button" title="切換日間／夜間模式" aria-label="切換日間／夜間模式">🌙</button>
  <button class="ctrl-btn" id="voiceToggle" type="button" title="語音提醒（尚未開啟）" aria-label="語音提醒開關">🔇</button>
</div>

<div class="topbar">
  <div class="unit">
    <span class="unit-name">臺東縣消防局　成功大隊</span>
    <span class="unit-sub" id="rocdate">—</span>
  </div>
  <div class="clockwrap">
    <span class="clock" id="clock">--:--<span class="sec">--</span></span>
    <div class="clock-sub">當前時間</div>
  </div>
  <div class="slotwrap">
    <span class="slot-label">當前勤務時段</span>
    <span class="slot" id="slot">--–--</span>
    <span class="slot-next" id="slotnext">—</span>
  </div>
</div>

<div class="notice" id="notice">
  <span class="notice-dot"></span>
  <span id="noticetext"><b>勤務資料為 2026-09-03 的畫面快照</b>　　尚未收到採集器送來的即時資料，畫面顯示內建範例。行事曆為 Google 行事曆真實資料。</span>
</div>

<div class="strip" id="strip"></div>

<div class="board">
  <div class="col">
    <div class="squads" id="squads"></div>
  </div>

  <div class="col">
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">當日勤務</span>
        <span class="panel-meta" id="taskmeta">—</span>
      </div>
      <div class="panel-body" id="tasks"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">行程</span>
        <span class="panel-meta">Google 行事曆</span>
      </div>
      <div class="cal-filter" id="calfilter"></div>
      <div class="panel-body" id="calbody"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">今日未到勤</span>
        <span class="panel-meta" id="leavemeta">—</span>
      </div>
      <div class="panel-body" id="leave"></div>
    </section>
  </div>
</div>

<div class="foot">
  <span class="live"><span class="live-dot"></span>時間與時段每秒更新</span>
  <span>資料來源：勤務表列表 + 各分隊勤務表（ttfd2.firemis.tw）＋ Google 行事曆</span>
  <span id="lastsync">—</span>
</div>

<script>
(function(){
  "use strict";

  var DOW=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function p2(n){return n<10?"0"+n:""+n;}
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"]/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }

  /* ===================================================================
     資料層 — 之後接上系統時，只要換掉這個物件即可，畫面程式不用動。
     來源：勤務表列表（#/shift/list）＋ 各分隊勤務表，2026-09-03。
     時段 key 格式 "HH-HH"，與系統勤務表的列完全一致。

  function parseRange(t){
    // "08-14" -> [8,14]；"10" -> [10,11]
    var m=String(t).match(/^(\d{1,2})-(\d{1,2})$/);
    if(m) return [+m[1],+m[2]];
    var s=String(t).match(/^(\d{1,2})$/);
    if(s) return [+s[1],+s[1]+1];
    return null;
  }

  // 各單位固定一個顏色（依名稱雜湊，不受資料到達順序影響），方便在依時間
  // 排序、不同單位項目交錯出現時，一眼分辨屬於哪個單位。
  var TASK_PALETTE=[
    {c:"var(--blue)",  bg:"rgba(74,159,216,.14)"},
    {c:"var(--violet)",bg:"rgba(155,140,216,.14)"},
    {c:"var(--green)", bg:"rgba(61,190,107,.14)"},
    {c:"var(--amber)", bg:"rgba(242,169,59,.14)"},
    {c:"#E4675A",       bg:"rgba(228,103,90,.14)"},
    {c:"#4DBFAE",       bg:"rgba(77,191,174,.14)"}
  ];
  function unitColor(name){
    var h=0;
    for(var i=0;i<name.length;i++){ h=(h*31+name.charCodeAt(i))>>>0; }
    return TASK_PALETTE[h%TASK_PALETTE.length];
  }

  function taskRowHtml(t,isLive,isPast){
    var col=unitColor(t.unit||"");
    var cls="task"+(isLive?" live":"")+(isPast?" past":"");
    var html='<div class="'+cls+'">';
    html+='<span class="task-time">'+esc(t.time)+"</span>";
    html+='<span class="task-main">';
    html+='<span class="task-name"><span class="task-unit" style="background:'+col.bg+';color:'+col.c+'">'+
          esc(t.unit)+"</span>"+esc(t.name)+
          (isLive?'<span class="live-tag">進行中</span>':"")+"</span>";
    var sub=[];
    if(t.who) sub.push('人員 <span class="who">'+esc(t.who)+"</span>");
    if(t.car) sub.push("車輛 "+esc(t.car));
    if(t.loc) sub.push("地點 "+esc(t.loc));
    if(sub.length) html+='<span class="task-sub">'+sub.join("　")+"</span>";
    html+="</span></div>";
    return html;
  }

  var tasksPastOpen=false;

  function renderTasks(now){
    var host=document.getElementById("tasks");
    if(!host) return;
    var h=now.getHours(), live=0;

    // 依開始時間排序，讓不同單位、不同時長的項目照時間軸自然排列，
    // 不再是「先列大隊、再列分隊」這種跟時間無關的分組順序。
    var withMeta=TASKS.map(function(t){
      var r=parseRange(t.time);
      return {t:t, r:r, start:(r?r[0]:0)};
    });
    withMeta.sort(function(a,b){ return a.start-b.start; });

    var activeHtml="", pastHtml=[];
    withMeta.forEach(function(m){
      var t=m.t, r=m.r;
      var isPast=!!(r&&h>=r[1]);
      var isLive=!!(r&&h>=r[0]&&h<r[1]);
      if(isLive) live++;
      var row=taskRowHtml(t,isLive,isPast);
      if(isPast) pastHtml.push(row); else activeHtml+=row;
    });

    var html=activeHtml;
    if(pastHtml.length){
      html+='<div class="task-toggle" id="taskToggle">'+
            '<span class="arrow">'+(tasksPastOpen?"▾":"▸")+"</span>"+
            (tasksPastOpen?"收合":"顯示")+"已結束 "+pastHtml.length+" 項</div>";
      if(tasksPastOpen) html+=pastHtml.join("");
    }

    host.innerHTML=html||'<div class="cal-empty">今日尚無安排</div>';

    var toggle=document.getElementById("taskToggle");
    if(toggle) toggle.onclick=function(){
      tasksPastOpen=!tasksPastOpen;
      renderTasks(new Date());
    };

    var meta=document.getElementById("taskmeta");
    if(meta) meta.textContent=live>0?("進行中 "+live+" 項"):"目前無進行中項目";
  }

  /* ---- 行事曆來源篩選 ----
     從 CAL 資料裡掃出所有出現過的「行事曆來源」（大隊／局本部／義消），
     每個來源一顆篩選鈕，開關狀態記在瀏覽器裡，重新整理後還記得。 */
  var CAL_NAMES=[], CAL_NAME_TAG={};
  (function(){
    var seen={};
    CAL.forEach(function(day){
      day.items.forEach(function(ev){
        if(!seen[ev.cal]){ seen[ev.cal]=true; CAL_NAMES.push(ev.cal); CAL_NAME_TAG[ev.cal]=ev.tag||"t1"; }
      });
    });
  })();

  var CAL_FILTER_KEY="board-cal-filter";
  var calActive=(function(){
    var saved=null;
    try{ saved=JSON.parse(localStorage.getItem(CAL_FILTER_KEY)||"null"); }catch(e){}
    if(Array.isArray(saved)){
      var s=new Set(saved.filter(function(n){ return CAL_NAMES.indexOf(n)>=0; }));
      if(s.size) return s;
    }
    return new Set(CAL_NAMES);   // 預設全選
  })();

  function saveCalFilter(){
    try{ localStorage.setItem(CAL_FILTER_KEY,JSON.stringify(Array.from(calActive))); }catch(e){}
  }

  function renderCalFilterChips(){
    var host=document.getElementById("calfilter");
    if(!host||CAL_NAMES.length<2) return;   // 只有一個來源就不需要篩選鈕

    host.innerHTML=CAL_NAMES.map(function(name){
      var on=calActive.has(name);
      var tag=CAL_NAME_TAG[name];
      return '<button type="button" class="cal-chip '+tag+(on?" on":"")+
             '" data-cal="'+esc(name)+'">'+esc(name)+"</button>";
    }).join("");

    Array.prototype.forEach.call(host.querySelectorAll(".cal-chip"),function(btn){
      btn.onclick=function(){
        var n=btn.getAttribute("data-cal");
        if(calActive.has(n)){
          if(calActive.size>1) calActive.delete(n);   // 至少留一個，避免整排關光看起來像壞掉
        }else{
          calActive.add(n);
        }
        saveCalFilter();
        renderCalFilterChips();
        renderCal(new Date());
      };
    });
  }

  /* 行事曆目前是靜態快照（撰寫看板時手動抓一次 Google 行事曆存進來的），
     不是即時連線——系統裡沒有會自動去問 Google 要新資料的東西，所以快照
     用完（超過 CAL 陣列最後一天）畫面就不會再長出新的一天。真正要做到
     自動更新，需要在伺服器那端另外接 Google 行事曆的正式介面，這是比較
     大的工程，目前尚未實作。這裡先做到位的是：已經過去的日期會自動從
     畫面移除，不會像之前那樣一直卡在舊日期。 */
  function renderCal(now){
    var host=document.getElementById("calbody");
    if(!host) return;
    var todayKey=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
    var nowMin=now.getHours()*60+now.getMinutes();
    var html="";
    var upcoming=CAL.filter(function(day){ return day.d>=todayKey; });

    if(!upcoming.length){
      host.innerHTML='<div class="cal-empty">行事曆快照已用完，需要重新抓取最新行程。</div>';
      return;
    }

    upcoming.forEach(function(day){
      var pt=day.d.split("-");
      var dt=new Date(+pt[0],+pt[1]-1,+pt[2]);
      var isToday=(day.d===todayKey);
      var items=day.items.filter(function(ev){ return calActive.has(ev.cal); });

      // 這天原本就沒有行程 → 顯示「無行程」；
      // 這天有行程、但全部被篩選鈕關掉 → 整天跳過，不特別顯示，
      // 避免跟「真的沒行程」混淆。
      if(day.items.length&&!items.length) return;

      html+='<div class="cal-day"><div class="cal-daylabel">';
      html+='<span class="cal-date">'+(+pt[1])+"/"+(+pt[2])+"</span>";
      html+='<span class="cal-dow">'+DOW[dt.getDay()]+"</span>";
      if(isToday) html+='<span class="cal-today">今日</span>';
      html+="</div>";

      if(!items.length) html+='<div class="cal-empty">無行程</div>';

      items.forEach(function(ev){
        var live=false;
        if(isToday&&ev.t){
          var m=ev.t.match(/(\d{2}):(\d{2}).(\d{2}):(\d{2})/);
          if(m){
            var s=+m[1]*60+ +m[2], e=+m[3]*60+ +m[4];
            live=(nowMin>=s&&nowMin<e);
          }
        }
        html+='<div class="ev'+(live?" now":"")+'">';
        html+='<span class="ev-time'+(ev.allday?" allday":"")+'">'+(ev.allday?"全天":esc(ev.t))+"</span>";
        html+='<span class="ev-main"><span class="ev-title">'+esc(ev.title)+"</span>";
        if(ev.loc) html+='<div class="ev-loc">'+esc(ev.loc)+"</div>";
        html+='<span class="ev-tag '+ev.tag+'">'+esc(ev.cal)+"</span>";
        html+="</span></div>";
      });
      html+="</div>";
    });
    host.innerHTML=html||'<div class="cal-empty">所選的行事曆來源近期無行程</div>';
  }

  var lastKey=null, lastMin=-1;

  function tick(){
    var now=new Date();
    var h=now.getHours(), mi=now.getMinutes();
    var nowMin=h*60+mi;
    var key=slotKey(h);

    var c=document.getElementById("clock");
    if(c) c.innerHTML=p2(h)+":"+p2(mi)+'<span class="sec">'+p2(now.getSeconds())+"</span>";

    var rd=document.getElementById("rocdate");
    if(rd){
      rd.textContent="民國 "+(now.getFullYear()-1911)+" 年 "+(now.getMonth()+1)+" 月 "+
                     now.getDate()+" 日　"+DOW[now.getDay()];
    }

    var sl=document.getElementById("slot");
    if(sl) sl.textContent=key.replace("-"," – ");

    var sn=document.getElementById("slotnext");
    if(sn) sn.textContent="本時段尚餘 "+(60-mi)+" 分，下一時段 "+p2((h+1)%24)+":00";

    if(key!==lastKey){ lastKey=key; renderSquads(key); }

    if(nowMin!==lastMin){
      lastMin=nowMin;
      renderTasks(now);
      renderCal(now);
      checkAnnouncements(now);
      var ls=document.getElementById("lastsync");
      if(ls) ls.textContent="畫面時間 "+p2(h)+":"+p2(mi);
    }
  }

  /* =================== 向伺服器取得最新資料 ===================
     取得成功 → 用即時資料取代上面的內建快照並重繪。
     取不到（尚未部署、採集器還沒送過、服務休眠）→ 保持快照，畫面照常可看。
     ============================================================ */

  function setNotice(html,live){
    var t=document.getElementById("noticetext");
    var n=document.getElementById("notice");
    if(t) t.innerHTML=html;
    if(n){
      n.style.background=live?"var(--green-tint)":"";
      n.style.borderBottomColor=live?"var(--green-tint-border)":"";
      n.style.color=live?"var(--green)":"";
      var dot=n.querySelector(".notice-dot");
      if(dot) dot.style.background=live?"var(--green)":"var(--amber)";
    }
  }

  function fmtTime(iso){
    try{
      var d=new Date(iso);
      return p2(d.getHours())+":"+p2(d.getMinutes());
    }catch(e){ return "—"; }
  }

  /* ---- 資料新鮮度 ----
     採集器改成數小時才推送一次後，若因授權過期等原因悄悄停止更新，
     畫面不該毫無警示地停在舊資料上。每分鐘檢查一次：距離最後一次
     收到資料超過門檻，就把告示條轉成警示色，提醒去隊部電腦重新
     執行一次採集器。門檻抓「採集週期 + 1 小時緩衝」。 */
  var remoteReceivedAt=null, remoteDutyDate=null;
  var STALE_MS=5*60*60*1000;

  function checkFreshness(){
    if(!remoteReceivedAt) return;   // 還沒收過即時資料，沿用開機時的預設告示
    var ageMs=Date.now()-remoteReceivedAt.getTime();
    if(ageMs>STALE_MS){
      var hrs=Math.floor(ageMs/3600000);
      setNotice("<b>資料已 "+hrs+" 小時未更新</b>　　請至隊部電腦重新執行一次「更新勤務看板」書籤。",false);
    }else{
      setNotice("<b>即時資料</b>　　勤務日期 "+esc(remoteDutyDate||"")+
                "　最後採集 "+fmtTime(remoteReceivedAt.toISOString())+
                "　　行事曆為 Google 行事曆資料。",true);
    }
  }

  function loadRemote(){
    if(!window.fetch) return;
    fetch("/api/duty",{cache:"no-store"})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j||!j.ok||!j.data) return;
        var d=j.data;

        if(Array.isArray(d.units)&&d.units.length){
          UNITS=d.units.map(function(u){
            var o={
              name:u.name,chief:u.chief,
              day:+u.day||0,night:+u.night||0,
              ids:u.ids||"",roster:u.roster||"",note:u.note||"",
              byId:!!u.byId,cars:u.cars||[],
              leave:u.leave||null
            };
            // slots 可為 {"08-09":{duty,cars,standby,rest}} 或列陣列
            if(u.slots&&!Array.isArray(u.slots)) o.slots=u.slots;
            else if(Array.isArray(u.slots)&&u.slots.length) o.slots=toMap(u.slots);
            return o;
          });
        }
        if(Array.isArray(d.tasks)) TASKS=d.tasks;

        remoteReceivedAt=new Date(j.receivedAt);
        remoteDutyDate=d.date;
        checkFreshness();

        renderStrip();
        renderLeave();
        lastKey=null; lastMin=-1;   // 強制重繪
        tick();
      })
      .catch(function(){ /* 取不到就保持快照，不打擾畫面 */ });
  }

  /* =================== 日間／夜間模式 =================== */
  (function(){
    var btn=document.getElementById("themeToggle");
    if(!btn) return;
    function apply(light){
      document.documentElement.setAttribute("data-theme",light?"light":"dark");
      btn.textContent=light?"☀️":"🌙";
      btn.classList.toggle("on",light);
      btn.title=light?"切換成夜間模式":"切換成日間模式";
    }
    var saved=null;
    try{ saved=localStorage.getItem("board-theme"); }catch(e){}
    apply(saved==="light");
    btn.onclick=function(){
      var next=document.documentElement.getAttribute("data-theme")!=="light";
      apply(next);
      try{ localStorage.setItem("board-theme",next?"light":"dark"); }catch(e){}
    };
  })();

  /* =================== 語音提醒 ===================
     勤務時段前 30 分鐘，語音唸出即將開始的行事曆／勤務項目。
     用瀏覽器內建的語音合成（不必連外部服務），預設關閉——瀏覽器規定
     要先有一次使用者操作（按播放鈕）才准許自動發聲，所以無法一開頁面
     就自己講話，這是瀏覽器的限制，不是看板的限制。
     ================================================= */
  var voiceEnabled=false;
  var announcedKeys={}, announcedDate=null;

  function speak(text){
    if(!window.speechSynthesis) return;
    try{
      var u=new SpeechSynthesisUtterance(text);
      u.lang="zh-TW";
      u.rate=1;
      var voices=window.speechSynthesis.getVoices();
      var zh=voices.find(function(v){ return /^zh/i.test(v.lang); });
      if(zh) u.voice=zh;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function collectAnnouncements(now){
    var todayKey=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
    var list=[];

    CAL.forEach(function(day){
      if(day.d!==todayKey) return;
      day.items.forEach(function(ev){
        if(ev.allday||!ev.t) return;
        if(!calActive.has(ev.cal)) return;   // 被篩選鈕關掉的來源不播報
        var m=ev.t.match(/^(\d{2}):(\d{2})/);
        if(!m) return;
        var startMin=(+m[1])*60+(+m[2]);
        list.push({
          key:"cal|"+day.d+"|"+ev.t+"|"+ev.title,
          startMin:startMin,
          text:"提醒，"+(+m[1])+"點"+(+m[2]?(+m[2]+"分"):"")+"，行事曆「"+ev.title+"」即將開始"
        });
      });
    });

    TASKS.forEach(function(t){
      var r=parseRange(t.time);
      if(!r) return;
      var startMin=r[0]*60;
      list.push({
        key:"task|"+t.unit+"|"+t.time+"|"+t.name,
        startMin:startMin,
        text:"提醒，"+r[0]+"點，"+t.unit+"勤務「"+t.name+"」即將開始"
      });
    });

    return list;
  }

  function checkAnnouncements(now){
    if(!voiceEnabled) return;
    var todayKey=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(now.getDate());
    if(announcedDate!==todayKey){ announcedKeys={}; announcedDate=todayKey; }

    var nowMin=now.getHours()*60+now.getMinutes();
    collectAnnouncements(now).forEach(function(item){
      var alertAt=item.startMin-30;
      if(nowMin>=alertAt&&nowMin<alertAt+2&&!announcedKeys[item.key]){
        announcedKeys[item.key]=true;
        speak(item.text);
      }
    });
  }

  (function(){
    var btn=document.getElementById("voiceToggle");
    if(!btn) return;
    if(!window.speechSynthesis){
      btn.disabled=true;
      btn.title="此瀏覽器不支援語音播放";
      btn.style.opacity=".4";
      return;
    }
    btn.onclick=function(){
      voiceEnabled=!voiceEnabled;
      btn.textContent=voiceEnabled?"🔊":"🔇";
      btn.classList.toggle("on",voiceEnabled);
      btn.title=voiceEnabled?"語音提醒：播放中（點一下暫停）":"語音提醒（尚未開啟）";
      if(voiceEnabled){
        speak("語音提醒已開啟");
      }else{
        window.speechSynthesis.cancel();
      }
    };
  })();

  renderStrip();
  renderLeave();
  renderCalFilterChips();
  tick();
  setInterval(tick,1000);
  setInterval(checkFreshness,60*1000);   // 每分鐘檢查一次資料是否太久沒更新

  loadRemote();
  setInterval(loadRemote,5*60*1000);   // 看板每 5 分鐘向伺服器要一次資料（與採集器推送頻率無關）
})();
</script>
